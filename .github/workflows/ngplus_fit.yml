name: NG+ fitter pass

# Fits the stock core and the NG+ core back to back FROM THE SAME TREE and
# reports the timing/resource delta, so the cost of the tap + player is
# measured rather than guessed.  NG+ is macro-gated (`NGPLUS`, set in
# files.qip); the stock leg strips that line before compiling.
#
# Each leg is a full Quartus 17.1 compile of the NeoGeo project (the
# MiSTer framework needs 17.0/17.1): expect ~1 h per leg on a hosted runner.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Quartus fitter seed (both legs)
        required: false
        default: "1"
      legs:
        description: 'legs to fit: both, ngplus, or stock'
        required: false
        default: "both"
      dbg:
        description: 'on-screen audio diagnostic overlay (1 = build with NGPLUS_DBG)'
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
    steps:
      - id: pick
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          case "$LEGS" in
            both|"") legs='["stock","ngplus"]' ;;
            stock|ngplus) legs="[\"$LEGS\"]" ;;
            *) echo "unknown legs '$LEGS' (want both|stock|ngplus)" >&2; exit 1 ;;
          esac
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  fitter:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight -- NG+ file set
        run: |
          rc=0
          for f in $(grep -o 'rtl/ngplus/[A-Za-z0-9_]*\.v' files.qip | sort -u); do
            [ -f "$f" ] && echo "ok   $f" || { echo "FAIL missing $f" >&2; rc=1; }
          done
          grep -q 'NGPLUS=1' files.qip || { echo "FAIL: NGPLUS macro not in files.qip" >&2; rc=1; }
          exit $rc

      - name: Debug overlay (NGPLUS_DBG)
        if: matrix.leg == 'ngplus' && inputs.dbg == '1'
        run: |
          echo 'set_global_assignment -name VERILOG_MACRO "NGPLUS_DBG=1"' >> files.qip
          tail -2 files.qip

      - name: Strip the NGPLUS macro (stock leg)
        if: matrix.leg == 'stock'
        run: |
          sed -i '/VERILOG_MACRO "NGPLUS=1"/d' files.qip
          sed -i '/rtl\/ngplus\//d' files.qip
          ! grep -q NGPLUS files.qip

      - name: Quartus 17.1 compile (${{ matrix.leg }})
        env:
          SEED: ${{ inputs.seed }}
        run: |
          docker run --rm --platform linux/amd64 \
            -e SEED="$SEED" -v "$PWD":/build -w /build \
            raetro/quartus:17.1 \
            bash -c '
              set -e
              quartus_sh --set SEED=$SEED NeoGeo
              set -o pipefail
              quartus_sh --flow compile NeoGeo 2>&1 | tail -40
            '

      # Collect on the host: the container script is a single-quoted string,
      # so anything with quotes of its own lives here.
      - name: Collect results
        if: always()
        run: |
          mkdir -p fit_results
          suffix=""; [ "${{ inputs.dbg }}" = "1" ] && suffix="_DBG"
          for f in output_files/*.rbf; do cp "$f" "fit_results/NeoGeoPlus${suffix}_$(date +%Y%m%d).rbf"; done 2>/dev/null || true
          cp output_files/NeoGeo.fit.summary output_files/NeoGeo.sta.rpt output_files/NeoGeo.sta.summary fit_results/ 2>/dev/null || true
          awk '/^Type +: (Setup|Hold)/{t=$0} /^Slack/{if(t){print t" | "$0; t=""}}' output_files/NeoGeo.sta.summary > fit_results/slack.txt || true
          grep -c "Timing requirements not met" output_files/NeoGeo.sta.rpt > fit_results/sta_violations.txt || true
          echo "== worst slack per clock"; cat fit_results/slack.txt
          echo "== STA violations: $(cat fit_results/sta_violations.txt)"
          test -s fit_results/NeoGeo.fit.summary

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngplus-fit-${{ matrix.leg }}
          path: fit_results
          retention-days: 14
          if-no-files-found: warn
